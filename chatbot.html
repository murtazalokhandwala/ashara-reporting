<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ashara 1448H Toronto — Information Assistant</title>
<style>
:root {
  --navy:#0F2744; --blue:#1A4F96; --white:#FFFFFF;
  --bg:#F2F2F7; --card:#FFFFFF; --border:#E5E5EA;
  --muted:#8E8E93; --text:#1C1C1E; --green:#1D9E75;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* HEADER */
.hdr{background:var(--navy);color:white;padding:14px 16px;padding-top:calc(14px + var(--safe-t));display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-icon{width:38px;height:38px;background:rgba(255,255,255,0.13);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hdr-title{font-size:14px;font-weight:600}
.hdr-sub{font-size:11px;opacity:.6;margin-top:1px}
.hdr-badge{margin-left:auto;background:rgba(29,158,117,.3);border-radius:10px;padding:3px 9px;font-size:10px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.hdr-dot{width:5px;height:5px;background:var(--green);border-radius:50%}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}

/* HOME SCREEN */
.welcome-bubble{background:var(--card);border:1px solid var(--border);border-radius:0 14px 14px 14px;padding:11px 14px;font-size:13.5px;line-height:1.65;color:var(--text)}
.welcome-from{font-size:11px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:5px}

.sec-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:4px 0 8px}

/* CATEGORY GRID */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 11px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .13s}
.cat-card:active{transform:scale(.97)}
.cat-card:hover{border-color:var(--blue)}
.cat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.cat-name{font-size:12.5px;font-weight:500;color:var(--text);line-height:1.3}
.cat-desc{font-size:10.5px;color:var(--muted);margin-top:1px}

/* QUICK QUESTIONS */
.q-list{display:flex;flex-direction:column;gap:7px}
.q-item{background:var(--card);border:1.5px solid var(--border);border-radius:22px;padding:8px 14px;font-size:13px;color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all .13s}
.q-item:hover,.q-item:active{background:var(--blue);color:white;border-color:var(--blue)}
.q-item span{font-size:13px;opacity:.5}

/* RELATED Qs after category tap */
.related-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.related-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.back-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--blue);cursor:pointer;margin-bottom:10px;padding:4px 0}

/* MESSAGES */
.msg{display:flex;gap:8px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.bot .msg-av{background:var(--navy);color:white}
.msg.user .msg-av{background:var(--blue);color:white}
.msg-bub{max-width:calc(100% - 76px);padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.65}
.msg.bot .msg-bub{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.msg.user .msg-bub{background:var(--blue);border-bottom-right-radius:4px;color:white}
.msg.bot .msg-bub strong{font-weight:600}
.msg.bot .msg-bub ul{padding-left:16px;margin:5px 0}
.msg.bot .msg-bub li{margin:3px 0}
.msg.bot .msg-bub a{color:var(--blue);text-decoration:underline}

/* FOLLOW-UP CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px 11px;font-size:12px;color:var(--blue);cursor:pointer;transition:all .12s}
.chip:hover,.chip:active{background:var(--blue);color:white;border-color:var(--blue)}

/* TYPING */
.typing-bub{background:var(--card);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:10px 14px;display:flex;gap:4px;align-items:center}
.td{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.1s infinite}
.td:nth-child(2){animation-delay:.18s}
.td:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* INPUT */
.inp-area{background:var(--card);border-top:1px solid var(--border);padding:10px 12px;padding-bottom:calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.inp-wrap{flex:1;background:var(--bg);border-radius:22px;border:1.5px solid var(--border);display:flex;align-items:flex-end;padding:8px 14px;transition:border-color .13s}
.inp-wrap:focus-within{border-color:var(--blue)}
textarea{flex:1;background:transparent;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--text);resize:none;max-height:110px;line-height:1.4}
textarea::placeholder{color:var(--muted)}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--navy);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .13s}
.send-btn:hover{background:var(--blue)}
.send-btn:disabled{background:var(--muted);cursor:not-allowed}
.send-btn svg{width:16px;height:16px}

/* SETUP */
.setup{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:28px 20px;text-align:center;gap:14px}
.setup h2{font-size:19px;color:var(--navy);font-weight:600}
.setup p{font-size:13.5px;color:var(--muted);max-width:300px;line-height:1.6}
.setup input{width:100%;max-width:340px;padding:12px 15px;border-radius:12px;border:1.5px solid var(--border);font-size:14px;outline:none;font-family:inherit}
.setup input:focus{border-color:var(--blue)}
.setup button{width:100%;max-width:340px;padding:13px;border-radius:12px;border:none;background:var(--navy);color:white;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.setup button:hover{background:var(--blue)}
.setup-note{font-size:11.5px;color:var(--muted);max-width:300px}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-icon">🕌</div>
  <div>
    <div class="hdr-title">Ashara 1448H Toronto</div>
    <div class="hdr-sub">Information Assistant · Anjuman-e-Saifee</div>
  </div>
  <div class="hdr-badge"><div class="hdr-dot"></div> Live</div>
</div>

<!-- SETUP (shown if no AppScript URL) -->
<div class="setup hidden" id="setupScreen">
  <div style="font-size:44px">🔑</div>
  <h2>Configuration Required</h2>
  <p>Please contact the PMO team to get access to the Ashara Information Assistant.</p>
  <p>For urgent queries call the helpline:</p>
  <p style="font-size:20px;font-weight:600;color:var(--navy)">437-427-4662</p>
</div>

<!-- MAIN CHAT -->
<div class="scroll" id="scrollDiv"></div>

<div class="inp-area" id="inpArea">
  <div class="inp-wrap">
    <textarea id="userInput" placeholder="Ask anything about Ashara 1448H…" rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="send()" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<script>
// ── CONFIG — paste your AppScript /exec URL here ──────────────────────────
const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzcESKh0ybJhqNbaiYHpIYQpWvypt2sMoIiXEnXimLGJNipFiBgzPMM0j9lJr2bYO9uXA/exec';
// ─────────────────────────────────────────────────────────────────────────

const CATEGORIES = [
  { id:'parking',  icon:'🅿️',  bg:'#E8F0FB', name:'Parking',       desc:'Lots, street, drop-off',
    qs:['Where are the free parking lots?','Is there street parking nearby?','Where do I drop off my family?','Is there parking for pass holders?','Can I carpool or use Uber?'] },
  { id:'entry',    icon:'🚶',  bg:'#EAFAF1', name:'Entry & Flow',   desc:'Gates, ITS cards, scanning',
    qs:['What time do gates open?','Do I need a physical ITS card?','Where do gents enter?','Where do ladies enter?','My child has no ITS card — what do I do?'] },
  { id:'niyaz',    icon:'🍽️', bg:'#FEF9E7', name:'Niyaz & Mawaid', desc:'Food, timings, register',
    qs:['When is Niyaz served?','Where is Niyaz served?','How do I register for Niyaz?','How does the Thaal nizaam work?','Is dinner served every night?'] },
  { id:'medical',  icon:'🏥',  bg:'#FCEBEB', name:'Medical',        desc:'Mahal us Shifa, emergency',
    qs:['Is there a medical camp on site?','What services does Mahal us Shifa provide?','What do I do in a medical emergency?','Where is the nearest hospital?','Can I get prescriptions filled nearby?'] },
  { id:'rahat',    icon:'🤲',  bg:'#F4ECF7', name:'Rahat',          desc:'Seniors, wheelchair, Waaz link',
    qs:['Where is the Rahat block?','Is there wheelchair assistance?','How do I request a Waaz link?','Is there transport for seniors?','What should seniors bring?'] },
  { id:'schedule', icon:'📅',  bg:'#E0EEFF', name:'Schedule',       desc:'Waaz, Niyaz, Majlis timings',
    qs:['What time does Waaz start?','Is Toronto hosting the live Waaz?','What is the evening schedule?','When are the Ashara dates?','What is the daily schedule?'] },
  { id:'water',    icon:'💧',  bg:'#E1F5EE', name:'Water & Facilities', desc:'Water stations, washrooms',
    qs:['Do I need to bring a water bottle?','Where are the water stations?','Where are the washrooms?'] },
  { id:'contacts', icon:'📞',  bg:'#EAF4FB', name:'Contacts & Helpline', desc:'Helpline, key numbers',
    qs:['What is the helpline number?','Who do I call for Niyaz queries?','Who do I contact for parking passes?','What are the PMO contact numbers?'] },
];

const QUICK_QS = [
  'What time does Waaz start?',
  'Where can I park for free?',
  'How do I register for Niyaz?',
  'Is there a medical camp on site?',
];

// Follow-up chips per topic keyword
const FOLLOW_UPS = {
  parking:  ['Drop-off zones?','Street parking streets?','Carpool suggestion?'],
  entry:    ['ITS card rules?','Where do ladies enter?','What are the gate numbers?'],
  niyaz:    ['Where is food served?','Thaal nizaam?','Registration link?'],
  medical:  ['Emergency protocol?','Nearest hospital?','Prescription info?'],
  rahat:    ['Waaz link request?','Transport for seniors?','Rahat location?'],
  schedule: ['Evening schedule?','Ashara dates?','Daily timings?'],
  water:    ['Water station locations?','Washroom locations?'],
  contacts: ['PMO numbers?','Niyaz contacts?','Rahat contacts?'],
};

let history = [];
let loading = false;
let activeCategory = null;

// ── INIT ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  if (!APPSCRIPT_URL || APPSCRIPT_URL === 'YOUR_APPSCRIPT_EXEC_URL_HERE') {
    document.getElementById('setupScreen').classList.remove('hidden');
    document.getElementById('scrollDiv').classList.add('hidden');
    document.getElementById('inpArea').classList.add('hidden');
    return;
  }
  renderHome();
  setupTextarea();
});

// ── HOME SCREEN ───────────────────────────────────────────────────────────
function renderHome() {
  const div = document.getElementById('scrollDiv');
  div.innerHTML = '';

  // Welcome bubble
  const fromEl = el('div','welcome-from','🕌 Assistant');
  const bubbleEl = el('div','welcome-bubble',
    'Marhaba wa Sahlan! 🌹\n\nWelcome to Ashara Mubaraka 1448H Toronto. I\'m here to help with parking, entry, Niyaz, medical services, senior support and more.\n\nSelect a topic or type your question below.');
  bubbleEl.style.whiteSpace = 'pre-line';
  const wrap = el('div','');
  wrap.appendChild(fromEl); wrap.appendChild(bubbleEl);
  div.appendChild(wrap);

  // Categories
  const catLabel = el('div','sec-label','Browse by topic');
  div.appendChild(catLabel);
  const grid = el('div','cat-grid');
  CATEGORIES.forEach(c => {
    const card = el('div','cat-card');
    const icon = el('div','cat-icon', c.icon);
    icon.style.background = c.bg;
    const txt = el('div','');
    txt.appendChild(el('div','cat-name', c.name));
    txt.appendChild(el('div','cat-desc', c.desc));
    card.appendChild(icon); card.appendChild(txt);
    card.onclick = () => showCategory(c);
    grid.appendChild(card);
  });
  div.appendChild(grid);

  // Quick questions
  const qqLabel = el('div','sec-label','Quick questions');
  qqLabel.style.marginTop = '6px';
  div.appendChild(qqLabel);
  const qlist = el('div','q-list');
  QUICK_QS.forEach(q => {
    const item = el('div','q-item');
    item.appendChild(el('span','',q));
    item.appendChild(el('span','','›'));
    item.onclick = () => askQ(q);
    qlist.appendChild(item);
  });
  div.appendChild(qlist);

  scrollBot();
}

// ── CATEGORY VIEW ─────────────────────────────────────────────────────────
function showCategory(cat) {
  activeCategory = cat.id;
  const div = document.getElementById('scrollDiv');
  div.innerHTML = '';

  const back = el('div','back-btn');
  back.innerHTML = '‹ All topics';
  back.onclick = renderHome;
  div.appendChild(back);

  const wrap = el('div','related-wrap');
  wrap.appendChild(el('div','related-title', cat.icon + ' ' + cat.name + ' — Related questions'));
  const qlist = el('div','q-list');
  cat.qs.forEach(q => {
    const item = el('div','q-item');
    item.appendChild(el('span','',q));
    item.appendChild(el('span','','›'));
    item.onclick = () => askQ(q);
    qlist.appendChild(item);
  });
  wrap.appendChild(qlist);
  div.appendChild(wrap);
  scrollBot();
}

// ── ASK QUESTION ─────────────────────────────────────────────────────────
function askQ(text) {
  document.getElementById('userInput').value = text;
  send();
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────
async function send() {
  const ta = document.getElementById('userInput');
  const text = ta.value.trim();
  if (!text || loading) return;
  ta.value = ''; ta.style.height = 'auto';

  loading = true;
  document.getElementById('sendBtn').disabled = true;

  const div = document.getElementById('scrollDiv');
  div.innerHTML = '';

  // Back button
  const back = el('div','back-btn');
  back.innerHTML = '‹ Back to topics';
  back.onclick = renderHome;
  div.appendChild(back);

  addUserMsg(text);
  history.push({ role:'user', content:text });
  addTyping();
  scrollBot();

  try {
    const resp = await fetch(APPSCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ messages: history })
    });
    const data = await resp.json();
    removeTyping();
    const reply = data.reply || 'Sorry, I could not process that. Please try again or call 437-427-4662.';
    history.push({ role:'assistant', content:reply });
    addBotMsg(reply);
    addFollowUpChips(text);
  } catch(err) {
    removeTyping();
    addBotMsg('Sorry, I could not connect. Please call our helpline at 437-427-4662 for assistance.');
  }

  loading = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBot();
}

// ── MESSAGE RENDERING ─────────────────────────────────────────────────────
function addUserMsg(text) {
  const div = document.getElementById('scrollDiv');
  const msg = el('div','msg user');
  const av = el('div','msg-av','👤');
  const bub = el('div','msg-bub'); bub.textContent = text;
  msg.appendChild(av); msg.appendChild(bub);
  div.appendChild(msg);
}

function addBotMsg(text) {
  const div = document.getElementById('scrollDiv');
  const msg = el('div','msg bot');
  const av = el('div','msg-av','🕌');
  const bub = el('div','msg-bub');
  bub.innerHTML = fmt(text);
  msg.appendChild(av); msg.appendChild(bub);
  div.appendChild(msg);
}

function addTyping() {
  const div = document.getElementById('scrollDiv');
  const msg = el('div','msg bot'); msg.id = 'typing';
  const av = el('div','msg-av','🕌');
  const bub = el('div','typing-bub');
  bub.innerHTML = '<div class="td"></div><div class="td"></div><div class="td"></div>';
  msg.appendChild(av); msg.appendChild(bub);
  div.appendChild(msg);
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addFollowUpChips(text) {
  const div = document.getElementById('scrollDiv');
  // Detect topic from text
  let chips = [];
  const lower = text.toLowerCase();
  for (const [key, vals] of Object.entries(FOLLOW_UPS)) {
    if (lower.includes(key) || lower.includes(key.slice(0,4))) {
      chips = vals; break;
    }
  }
  if (!chips.length) chips = ['Tell me more','Helpline number?','Any other info?'];

  const row = el('div','chips');
  chips.forEach(c => {
    const chip = el('div','chip',c);
    chip.onclick = () => askQ(c);
    row.appendChild(chip);
  });
  div.appendChild(row);
}

// ── HELPERS ───────────────────────────────────────────────────────────────
function el(tag, cls, text) {
  const e = document.createElement(tag || 'div');
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function fmt(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[^]*?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n\n/g,'<br><br>')
    .replace(/\n/g,'<br>')
    .replace(/(437-427-4662|647-\d{3}-\d{4}|416-\d{3}-\d{4}|289-\d{3}-\d{4}|905-\d{3}-\d{4})/g,'<strong>$1</strong>')
    .replace(/(https?:\/\/[^\s<"]+)/g,'<a href="$1" target="_blank">$1</a>');
}

function scrollBot() {
  const d = document.getElementById('scrollDiv');
  d.scrollTop = d.scrollHeight;
}

function setupTextarea() {
  const ta = document.getElementById('userInput');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
}
</script>
</body>
</html>
